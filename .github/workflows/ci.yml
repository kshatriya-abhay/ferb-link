# Ferb Link's unit and contract tests and Android lint, on every push and pull request.
# No secrets and no signing: releases are built and signed on the maintainer's computer
# (README, Releases). No model, server or phone either (companion/README.md, Testing).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner has the Android SDK (ANDROID_HOME); accepting its licences lets Gradle fetch
      # the platform compileSdk names.
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit and contract tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            companion/app/build/reports/
            companion/app/build/test-results/
          if-no-files-found: ignore
