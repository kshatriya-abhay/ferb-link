# Ferb Link's unit and contract tests and Android lint, on every push and pull request.
# No secrets and no signing: releases are built and signed on the maintainer's computer
# (README, Releases). No model, server or phone either (companion/README.md, Testing).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Accepts the SDK licences, so Gradle can fetch the platform compileSdk names.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and contract tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            companion/app/build/reports/
            companion/app/build/test-results/
          if-no-files-found: ignore
