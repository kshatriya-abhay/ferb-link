# Settings for the laptop's model server (server/run.sh reads this; bash syntax).

# Which model to serve: a name from server/models.txt. Download it with `mise run server:model <name>`.
# Gemma 4 E2B was right most often in Ferb's bench, and hears speech (CAPABILITIES=full).
MODEL=gemma-4-e2b

# text: text in, tool calls and text out (what Ferb's bench measured).
# full: also images and audio in, through the model's projector (server/projectors.txt): about
# 1 GB more, mostly GPU memory. Ferb's voice input needs it. Switch with `mise run server:mode text|full`.
CAPABILITIES=full

# Only on localhost: `mise run server:tailnet on` puts it on the tailnet through Tailscale Serve.
PORT=8080

# Clients send "Authorization: Bearer <key>"; `mise run server:install` creates the key.
KEY_FILE="$HOME/.config/ferb-link/api-key"

# Layers on the GPU (RTX 3050 Ti, 4 GB): 99 or all means every layer, a number that many (the rest
# run on the CPU), auto lets llama.cpp pick what fits (--fit, leaving 1 GiB free).
GPU_LAYERS=99
CTX=8192
THREADS=8

# Seconds idle before the server unloads the model (-1: never). The process stays up and the next
# request loads it again. Measured with Gemma 4 E2B on the RTX 3050 Ti (2026-10-11):
# - loaded and idle: 1.8 GB of GPU memory and 2.6 GB of RAM, the card at about 15.6 W (P0);
# - asleep: 0.2 GB and 0.5 GB, the card at about 10 W (P8);
# - waking takes about 2 s with the model file in the page cache, 10-30 s from disk (after a
#   reboot or memory pressure), which can pass Ferb's 10 s timeout (it then answers on the phone).
# /health and /v1/models answer without waking it, so Ferb Link's connection check doesn't load it.
SLEEP_IDLE=300

# Ferb's repo, if you have it: `server:start` won't start while Ferb's bench runs (models run one at
# a time), `server:model` reuses the bench's downloads, and `server:chat` offers Ferb's tools. Next
# to this repo by default (ferb/ or on-device-assistant/); set FERB_REPO in the environment
# otherwise. Nothing needs it to exist.
_PARENT=$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)
[ -d "$_PARENT/ferb" ] && _FERB="$_PARENT/ferb" || _FERB="$_PARENT/on-device-assistant"
FERB_REPO="${FERB_REPO:-$_FERB}"
