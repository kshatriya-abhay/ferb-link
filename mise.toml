# ferb-link: the laptop's model server for Ferb (server/) and the Android companion app that
# connects Ferb to it (companion/).
#
# The server is llama.cpp's llama-server (a pinned release build, the same version as Ferb's
# bench), run as a systemd user service on localhost and put on the tailnet with Tailscale Serve.
# Settings are in server/server.conf.

# Java 21 is for the companion's Gradle build only, so it isn't under [tools]: setting up the
# server doesn't need it. The Gradle tasks name it (tools = …); install it once with
# `mise install java@temurin-21` (README, Build from source).

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
_.path = ["{{env.HOME}}/Android/Sdk/platform-tools"]

[tasks."server:install"]
description = "Download llama.cpp's pinned build (cuda or vulkan), create the API key, install the systemd user unit"
usage = '''
arg "[backend]" help="cuda (default; the RTX 3050 Ti) or vulkan (no CUDA libraries, smaller download)" default="cuda"
'''
run = '''
set -euo pipefail
B=server/build
REL=https://github.com/ggml-org/llama.cpp/releases/download/b11541
case "$usage_backend" in
  cuda)
    server/fetch.sh $REL/llama-b11541-bin-ubuntu-cuda-13.4-x64.tar.gz $B/downloads/llama-cuda.tar.gz 2d6f7589eb46f80905cd8fadcc41c67a0a5f5d6fe96ddd4fb37fd7a73a0872d5
    # The CUDA runtime it was built with (cuBLAS and friends), so it doesn't depend on the system's CUDA.
    server/fetch.sh $REL/cudart-llama-b11541-bin-ubuntu-cuda-13.4-x64.tar.gz $B/downloads/cudart.tar.gz 4d6dba50d1d16b3987b6a8cff73a58338ea1eba7ded1d3295ea174b4f515a746 ;;
  vulkan)
    server/fetch.sh $REL/llama-b11541-bin-ubuntu-vulkan-x64.tar.gz $B/downloads/llama-vulkan.tar.gz bf91ce14ddfda55c01c8b8846aa7d6093a07b0213913b6216ed4a2d6ea78b1f8 ;;
  *) echo "backend: cuda or vulkan"; exit 1 ;;
esac
D="$B/llama-$usage_backend"
rm -rf "$D"; mkdir -p "$D"
tar -xzf "$B/downloads/llama-$usage_backend.tar.gz" -C "$D"
BIN=$(dirname "$(find "$D" -name llama-server -type f | head -1)")
if [ "$usage_backend" = cuda ]; then
  # llama-server looks for its libraries next to itself ($ORIGIN).
  T=$(mktemp -d); tar -xzf "$B/downloads/cudart.tar.gz" -C "$T"
  find "$T" -name '*.so*' -exec cp -a {} "$BIN/" \;
  rm -rf "$T"
fi
ln -sfn "$(realpath "$BIN")" "$B/llama"
"$B/llama/llama-server" --list-devices

source server/server.conf
if [ ! -s "$KEY_FILE" ]; then
  mkdir -p "$(dirname "$KEY_FILE")"
  (umask 077; head -c 24 /dev/urandom | base64 | tr '+/' '-_' > "$KEY_FILE")
  echo "Created the API key in $KEY_FILE (mise run server:key shows it)."
fi
# Never overwritten once it exists (the phone has it); only kept private.
chmod 600 "$KEY_FILE"

mise run server:unit
echo "Next: mise run server:model $MODEL, then mise run server:start."
'''

[tasks."server:unit"]
description = "Install the systemd user unit ferb-llama and enable it at login (doesn't start or restart it)"
run = '''
set -euo pipefail
mkdir -p ~/.config/systemd/user
sed "s|@ROOT@|$PWD|g" server/ferb-llama.service.in > ~/.config/systemd/user/ferb-llama.service
systemctl --user daemon-reload
systemctl --user enable ferb-llama
echo "Installed ferb-llama.service, enabled at login."
'''

[tasks."server:model"]
description = "Download a model from server/models.txt (pinned, SHA-256 checked), and its projector in full mode"
usage = '''
arg "<name>" help="A name from server/models.txt"
'''
run = '''
set -euo pipefail
read -r _ REPO REV FILE SHA < <(grep "^$usage_name " server/models.txt) || { echo "No model $usage_name in server/models.txt"; exit 1; }
source server/server.conf
DEST="$MODELS_DIR/$FILE"
mkdir -p "$MODELS_DIR"
# Ferb's bench may have it already (on /data): move it to the SSD and leave the bench a symlink, so
# the file is stored once. Agreed with Ferb's session; the bench reads it through the link.
CACHED="$FERB_REPO/build/bench/models/$FILE"
if [ ! -f "$DEST" ] && [ -f "$CACHED" ] && [ ! -L "$CACHED" ] && echo "$SHA  $CACHED" | sha256sum -c --quiet 2>/dev/null; then
  cp "$CACHED" "$DEST.part" && echo "$SHA  $DEST.part" | sha256sum -c --quiet && mv "$DEST.part" "$DEST" && ln -sf "$DEST" "$CACHED"
fi
server/fetch.sh "https://huggingface.co/$REPO/resolve/$REV/$FILE" "$DEST" "$SHA"
echo "$usage_name is in $DEST."
# In full mode the server also needs the model's projector (images and audio in).
if [ "${CAPABILITIES:-text}" = full ] && read -r _ REPO REV PFILE PSHA < <(grep "^$usage_name " server/projectors.txt); then
  server/fetch.sh "https://huggingface.co/$REPO/resolve/$REV/$PFILE" "$MODELS_DIR/$usage_name-$PFILE" "$PSHA"
  echo "Its projector is in $MODELS_DIR/$usage_name-$PFILE."
fi
'''

[tasks."server:start"]
description = "Start the model server (systemd user service) and wait until it answers"
run = '''
set -euo pipefail
source server/server.conf
# Models run one at a time: never start while Ferb's bench holds its lock.
LOCK="$FERB_REPO/build/bench/.lock"
if [ -e "$LOCK" ] && ! flock -n "$LOCK" true; then
  echo "Ferb's bench is running; start the server after it finishes."; exit 1
fi
server/run.sh check
systemctl --user reset-failed ferb-llama 2>/dev/null || true
systemctl --user start ferb-llama
for _ in $(seq 120); do
  curl -fs "http://127.0.0.1:$PORT/health" >/dev/null && { echo "Serving $MODEL on 127.0.0.1:$PORT."; exit 0; }
  systemctl --user -q is-active ferb-llama || break
  sleep 1
done
echo "The server didn't come up:"; journalctl --user -u ferb-llama -n 30 --no-pager; exit 1
'''

[tasks."server:stop"]
description = "Stop the model server (do this before running Ferb's bench)"
run = "systemctl --user stop ferb-llama"

[tasks."server:run"]
description = "Run the model server in the foreground, for debugging (Ctrl+C stops it)"
run = "server/run.sh"

[tasks."server:status"]
description = "Show the service, whether it answers, and the Tailscale Serve config"
run = '''
source server/server.conf
systemctl --user --no-pager status ferb-llama | head -5
echo "health: $(curl -s "http://127.0.0.1:$PORT/health" || echo 'no answer')"
tailscale serve status
'''

[tasks."server:logs"]
description = "Follow the model server's log"
run = "journalctl --user -u ferb-llama -f"

[tasks."server:mode"]
description = "Show or switch what the model takes in: text (as Ferb's bench measured) or full (also images and audio)"
usage = 'arg "[capabilities]" help="text or full; without it, shows the current one"'
run = '''
set -euo pipefail
source server/server.conf
if [ -z "${usage_capabilities:-}" ]; then echo "CAPABILITIES=${CAPABILITIES:-text} (model $MODEL)"; exit 0; fi
case "$usage_capabilities" in text|full) ;; *) echo "text or full"; exit 1 ;; esac
if [ "$usage_capabilities" = full ]; then
  read -r _ REPO REV FILE SHA < <(grep "^$MODEL " server/projectors.txt) || { echo "No projector for $MODEL in server/projectors.txt"; exit 1; }
  server/fetch.sh "https://huggingface.co/$REPO/resolve/$REV/$FILE" "$MODELS_DIR/$MODEL-$FILE" "$SHA"
fi
sed -i "s/^CAPABILITIES=.*/CAPABILITIES=$usage_capabilities/" server/server.conf
echo "CAPABILITIES=$usage_capabilities"
if systemctl --user -q is-active ferb-llama; then
  systemctl --user stop ferb-llama
  mise run server:start
else
  echo "The server isn't running; mise run server:start uses it."
fi
'''

[tasks."server:chat"]
description = "Try the model in the terminal: a chat, or requests with Ferb's tools (/help inside)"
raw = true
run = "server/chat.sh"

[tasks."server:key"]
description = "Print the API key, to enter in the companion app"
run = 'source server/server.conf; cat "$KEY_FILE"'

[tasks."server:tailnet"]
description = "Put the server on the tailnet at http://<laptop>.<tailnet>.ts.net (Tailscale Serve), or take it off"
usage = '''
arg "[state]" help="on or off; without it, show whether the server is on the tailnet"
'''
run = '''
set -euo pipefail
source server/server.conf
URL="http://$(tailscale status --json | jq -r '.Self.DNSName | rtrimstr(".")')"
case "${usage_state:-}" in
  # Plain HTTP: Tailscale already encrypts everything between devices (WireGuard), and HTTPS
  # would need the tailnet's certificates turned on.
  on) tailscale serve --bg --http=80 "$PORT"
      echo "URL for the companion app: $URL" ;;
  off) tailscale serve --http=80 off ;;
  "") if tailscale serve status --json | jq -e --arg p "127.0.0.1:$PORT" 'any(.. | .Proxy? // empty; endswith($p))' >/dev/null; then
        echo "On the tailnet: $URL"
      else
        echo "Not on the tailnet (mise run server:tailnet on)"
      fi ;;
  *) echo "state: on or off"; exit 1 ;;
esac
'''

[tasks."server:pair"]
description = "Show a QR code that connects Ferb Link to this computer: scan it with the phone's camera"
run = '''
set -euo pipefail
LINK=$(server/pair-link.sh)
command -v qrencode >/dev/null || { echo "Needs qrencode (your distribution's package), or use mise run companion:pair with the phone on USB."; exit 1; }
qrencode -t ansiutf8 -m 2 "$LINK"
echo "Scan it with the phone's camera: Ferb Link opens and asks before connecting. If the camera only shows the"
echo "link, copy it and tap Paste link in Ferb Link."
echo "It holds the API key: don't screenshot or share it. Clear the terminal when done."
'''

[tasks."server:unload"]
description = "Unload the model now, freeing its GPU memory and RAM; the next request loads it again"
run = '''
set -euo pipefail
source server/server.conf
curl -sS -X POST "http://127.0.0.1:$PORT/models/unload" -H "Authorization: Bearer $(cat "$KEY_FILE")" \
  -H "Content-Type: application/json" -d "{\"model\": \"$MODEL\"}" | jq -r 'if .success then "Unloaded" else .error.message end'
'''

[tasks."server:ping"]
description = "Send one test request (a timer tool) and print the reply and timings"
usage = '''
arg "[where]" help="local (127.0.0.1) or tailnet (through Tailscale Serve, as the phone would)" default="local"
'''
run = '''
set -euo pipefail
source server/server.conf
case "$usage_where" in
  local) URL="http://127.0.0.1:$PORT" ;;
  tailnet) URL="http://$(tailscale status --json | jq -r '.Self.DNSName | rtrimstr(".")')" ;;
  *) echo "where: local or tailnet"; exit 1 ;;
esac
curl -fsS "$URL/v1/chat/completions" -H "Authorization: Bearer $(cat "$KEY_FILE")" -H "Content-Type: application/json" -d '{
  "model": "'"$MODEL"'",
  "messages": [{"role": "user", "content": "set a timer for 5 minutes"}],
  "tools": [{"type": "function", "function": {"name": "set_timer", "description": "Start a countdown timer",
    "parameters": {"type": "object", "properties": {"minutes": {"type": "integer"}}, "required": ["minutes"]}}}],
  "temperature": 0, "max_tokens": 128, "logprobs": true
}' | jq '{model, tool_calls: .choices[0].message.tool_calls, content: .choices[0].message.content, timings}'
'''

[tasks."companion:harness"]
tools = { java = "temurin-21" }
description = "Run Ferb Link's complete, transcribe and decide (Jev, which costs money) on the laptop, no phone: JSON lines in, Ferb Link's replies out"
usage = '''
arg "<in>" help="JSON lines: {\"request\": …, \"tools\": […]}, {\"audio\": \"clip.ogg\"} or {\"method\": \"decide\", …}, optional \"id\" (see LaptopHarness.kt)"
arg "[out]" help="where to write the replies; without it they're printed"
flag "--limit <n>" help="send at most n decide lines to Jev"
flag "--dry-run" help="send nothing at all (no model, no Jev): print how many decide calls, their estimated cost, and the other lines"
'''
run = '''
set -euo pipefail
IN=$(realpath "$usage_in")
OUT=$(realpath -m "${usage_out:-$(mktemp)}")
# No daemons left behind: they hold gigabytes the model server needs for its page cache.
status=0
(cd companion && flock /tmp/ferb-link-gradle.lock ./gradlew -q --no-daemon \
  :app:testDebugUnitTest --tests dev.abhay.ferblink.LaptopHarness --rerun \
  -Pharness.in="$IN" -Pharness.out="$OUT" -Pharness.limit="${usage_limit:-}" -Pharness.dry="${usage_dry_run:-false}") || status=$?
[ -n "${usage_out:-}" ] && [ "$status" = 0 ] && echo "Replies in $OUT" || { cat "$OUT" 2>/dev/null; [ -n "${usage_out:-}" ] || rm -f "$OUT"; }
# Jev's spend so far (the ledger lives outside the repo).
LEDGER=~/.config/ferb-link/jev-spend.json
[ -f "$LEDGER" ] && jq -r '"Jev spend on the laptop: $\(.tests.usd) in \(.tests.calls) calls (\(.tests.input_tokens) input tokens), of the $\(.cap_tests_usd) cap for tests"' "$LEDGER" >&2
exit "$status"
'''

# Every Gradle run in this repo takes /tmp/ferb-link-gradle.lock: companion:test and a harness run
# share the build folder (and the test task), and two at once broke each other (2026-10-16).
[tasks."companion:build"]
tools = { java = "temurin-21" }
description = "Build the companion app's debug APK"
dir = "companion"
run = "flock /tmp/ferb-link-gradle.lock ./gradlew --no-daemon assembleDebug"

[tasks."companion:test"]
tools = { java = "temurin-21" }
description = "The companion app's unit and contract tests: no model, server or phone (see README, Testing)"
dir = "companion"
# No daemons left behind: they hold gigabytes the model server needs for its page cache.
run = "flock /tmp/ferb-link-gradle.lock ./gradlew -q --no-daemon :app:testDebugUnitTest"

[tasks."companion:device-test"]
tools = { java = "temurin-21" }
description = "The companion app's device tests (pairing links, Paste link, hints) on the connected phone; it stays installed and paired"
dir = "companion"
usage = 'arg "[class]" help="Only this test class, e.g. HintsTest (no screen: fine while the phone is in use)" default=""'
run = """
set -euo pipefail
# Not connectedDebugAndroidTest: that uninstalls Ferb Link afterwards, and with it the pairing.
flock /tmp/ferb-link-gradle.lock ./gradlew -q --no-daemon :app:installDebug :app:installDebugAndroidTest
OUT=$(adb shell am instrument -w ${usage_class:+-e class dev.abhay.ferblink.$usage_class} dev.abhay.ferblink.test/androidx.test.runner.AndroidJUnitRunner)
echo "$OUT"
grep -q '^OK (' <<<"$OUT"
"""

[tasks."companion:contract-write"]
tools = { java = "temurin-21" }
description = "Rewrite contract/v1's fixtures from what Ferb Link answers; review the diff, and tell Ferb (link:contract-sync)"
dir = "companion"
run = "flock /tmp/ferb-link-gradle.lock ./gradlew -q --no-daemon :app:testDebugUnitTest --tests dev.abhay.ferblink.ContractTest --rerun -Pcontract.write=true"

[tasks."companion:install"]
tools = { java = "temurin-21" }
description = "Install the companion app on the connected phone"
dir = "companion"
run = "flock /tmp/ferb-link-gradle.lock ./gradlew --no-daemon installDebug"

[tasks."companion:release"]
tools = { java = "temurin-21" }
description = "Build the release APK and sign it with the release key (asks for what isn't set); dist/ferb-link-<version>.apk"
raw = true
run = "release/release.sh"

[tasks."companion:publish"]
description = "Publish dist/'s APK as a GitHub release (you run it: it asks you to type the version)"
raw = true
run = "release/publish.sh"

[tasks."companion:run"]
description = "Install and open the companion app on the connected phone"
depends = ["companion:install"]
run = "adb shell am start -n dev.abhay.ferblink/.MainActivity"

[tasks."companion:pair"]
description = "Connect Ferb Link on the phone (USB) to this computer: it asks on the phone before connecting"
run = '''
set -euo pipefail
LINK=$(server/pair-link.sh)
# adb shell joins its arguments into one remote command line: quote the link for the phone's shell.
adb shell am start -a android.intent.action.VIEW -d "'$LINK'" dev.abhay.ferblink >/dev/null
echo "Sent. On the phone, Ferb Link asks to connect: check the computer's name and tap Connect."
'''

[tasks."companion:send-over-tailscale"]
description = "Build the companion's debug APK and send it to a device with Taildrop"
usage = 'arg "<device>" help="The Tailscale device to send to, e.g. my-phone"'
depends = ["companion:build"]
dir = "companion"
run = """
set -euo pipefail
# Always the same name (Tailscale on Android never overwrites: a repeat arrives as FerbLink-<uuid>.apk).
cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FerbLink.apk
tailscale file cp app/build/outputs/apk/debug/FerbLink.apk "${usage_device}:"
echo "Sent FerbLink.apk to ${usage_device}"
"""

[tasks."companion:try"]
description = "Ask the companion on the connected phone for an answer through adb, as Ferb would (debug builds only)"
usage = 'arg "[request]" default="set a timer for 5 minutes"'
run = """
set -euo pipefail
# The sample tools from LinkViewModel, on one line for the shell.
TOOLS='[{"name":"set_timer","description":"Start a countdown timer for a number of minutes","parameters":{"type":"object","properties":{"minutes":{"type":"integer"}},"required":["minutes"]}}]'
# `content` splits each extra at colons, so the ones in a value are escaped.
escape() { printf %q "$(printf %s "$1" | sed 's/:/\\\\:/g')"; }
adb shell content call --uri content://dev.abhay.ferblink.link --method complete \
  --extra "request:s:$(escape "$usage_request")" --extra "tools:s:$(escape "$TOOLS")"
"""
